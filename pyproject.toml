[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triad"
version = "0.5.0"
description = "Plateforme d'audit cyber contradictoire NIS2 (Dit / Écrit / Réel) sur Google Cloud Run & Vertex AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Deloitte Risk Advisory Cyber" }
authors = [
  { name = "Deloitte Risk Advisory Cyber" },
]
keywords = ["nis2", "cybersecurity", "grc", "audit", "google-adk", "vertex-ai", "cloud-run"]
dependencies = [
  "fastapi>=0.115.0",
  "google-adk>=1.0.0",
  "google-cloud-compute>=1.20.0",
  "google-cloud-dlp>=3.20.0",
  "google-cloud-storage>=2.18.0",
  "google-genai>=1.0.0",
  "pydantic>=2.9.0",
  "pypdf>=5.0.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pyyaml>=6.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["triad"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
