# ==============================================================================
# Pipeline CI/CD Google Cloud Build — TRIAD (Audit Cyber Contradictoire NIS2)
# Étapes : 1. Tests Python (pytest) -> 2. Build Docker multi-stage ->
#          3. Push Artifact Registry -> 4. Déploiement Cloud Run (europe-west9)
# ==============================================================================

substitutions:
  _REGION: europe-west9
  _AR_REPO: triad
  _SERVICE_NAME: triad
  _SA_NAME: triad-auditor
  _IMAGE_TAG: latest
  _GEMINI_MODEL: gemini-2.5-flash
  _USE_GCP_SNAPSHOT: "false"
  _ALLOW_UNAUTH_FLAG: --no-allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. Exécution de la suite de tests unitaires, sécurité & API (hors appels live)
  - id: test-backend
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        pip install --no-cache-dir -r requirements.txt
        PYTHONPATH=src pytest -v tests/ -k "not live"

  # 2. Construction de l'image multi-stage (React 19 Vite + Python 3.11 non-root)
  - id: build-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - test-backend
    args:
      - build
      - --pull
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  # 3. Publication vers Artifact Registry (europe-west9)
  - id: push-image
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-image
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}

  # 4. Déploiement souverain sur Cloud Run v2 avec le compte moindre privilège triad-auditor
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor:
      - push-image
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --cpu-boost
      - --service-account=${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars=PROJECT_ID=${PROJECT_ID},VERTEX_LOCATION=${_REGION},GEMINI_MODEL=${_GEMINI_MODEL},USE_GCP_SNAPSHOT=${_USE_GCP_SNAPSHOT},LOG_FORMAT=json
      - ${_ALLOW_UNAUTH_FLAG}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest
